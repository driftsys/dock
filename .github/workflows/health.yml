name: Health check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC

env:
  REGISTRY: ghcr.io/driftsys/dock
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  packages: read

jobs:
  test:
    name: Test (${{ matrix.image }}, ${{ matrix.runner || 'ubuntu-latest' }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        image:
          - core
          - rust
          - deno
          - glab
          - node
          - lint
          - core-debian
          - rust-debian
          - deno-debian
          - glab-debian
          - node-debian
          - python-debian
          - polyglot-debian
        include:
          - image: rust
            runner: ubuntu-24.04-arm
          - image: rust-debian
            runner: ubuntu-24.04-arm
          - image: polyglot-debian
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          case "${{ matrix.image }}" in
            *-debian) tag="${{ matrix.image }}" ;;
            *) tag="${{ matrix.image }}-alpine" ;;
          esac
          docker pull "${{ env.REGISTRY }}:${tag}"

      - name: Run tests
        run: |
          set -o pipefail
          BASH_UNIT_FLAGS="-f tap" REGISTRY=${{ env.REGISTRY }} \
            bash tests/run.sh ${{ matrix.image }} \
            | tee test-results.tap

      - name: Run offline coverage tests
        if: matrix.image == 'rust' || matrix.image == 'rust-debian' || matrix.image == 'polyglot-debian'
        run: |
          case "${{ matrix.image }}" in
            rust) tag=rust-alpine ;;
            *) tag="${{ matrix.image }}" ;;
          esac
          bash tests/run-coverage.sh "ghcr.io/driftsys/dock:${tag}"

      - name: Test report
        if: always()
        run: |
          {
            echo "## Test results — \`${{ matrix.image }}\`"
            echo ""
            echo "| # | Result | Test |"
            echo "|---|--------|------|"
            awk '/^ok /     { sub(/^ok /,"");     printf "| %s | :white_check_mark: | %s |\n", NR, $0 }
                 /^not ok / { sub(/^not ok /,""); printf "| %s | :x: | %s |\n", NR, $0 }' \
              test-results.tap
          } >> "$GITHUB_STEP_SUMMARY"
