name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/driftsys/dock
  REGISTRY_DH: docker.io/driftsys/dock
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------
  # Phase 1 — build each arch on a native runner and push per-arch tags
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            targets: default
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            targets: |-
              multiarch
              debian
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push per-arch images
        uses: docker/bake-action@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORMS: ${{ matrix.platform }}
          PLATFORM_SUFFIX: -${{ matrix.arch }}
        with:
          targets: ${{ matrix.targets }}
          push: true
          set: |
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  # ------------------------------------------------------------------
  # Phase 2 — merge per-arch tags into multi-arch manifests
  # ------------------------------------------------------------------
  merge:
    name: Merge multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Android API level
        id: android
        run: |
          api=$(grep -A1 'variable "ANDROID_PLATFORM_VERSION"' docker-bake.hcl \
            | grep default | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "api=${api}" >> "$GITHUB_OUTPUT"

      - name: Resolve Android NDK version
        id: ndk
        run: |
          ndk=$(grep -A1 'variable "ANDROID_NDK_VERSION"' docker-bake.hcl \
            | grep default | sed 's/.*"\([0-9]*\)".*/\1/')
          echo "ndk=${ndk}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Bare tags (:core, :rust, …) are pushed by whichever variant is the
          # recommended default (see docker-bake.hcl img_tags), so they appear
          # here as their own basenames alongside the -alpine / -debian tags.
          images=(
            core core-alpine core-debian
            rust rust-alpine rust-debian
            deno deno-alpine deno-debian
            node node-alpine node-debian
            python python-debian
            polyglot polyglot-debian
            prose prose-debian
            jvm jvm-debian
            android android-debian
            android-${{ steps.android.outputs.api }} android-${{ steps.android.outputs.api }}-debian
            android-ndk android-ndk-debian
            android-ndk-${{ steps.ndk.outputs.ndk }} android-ndk-${{ steps.ndk.outputs.ndk }}-debian
          )

          # lint, std, and pages (bare, -alpine, and -debian) are amd64-only;
          # retag the amd64 build directly instead of merging a multi-arch
          # manifest.
          for img in lint lint-alpine lint-debian std std-alpine std-debian pages pages-alpine pages-debian; do
            for registry in "$REGISTRY" "$REGISTRY_DH"; do
              docker buildx imagetools create \
                -t "${registry}:${img}-${VERSION}" \
                -t "${registry}:${img}" \
                "${registry}:${img}-${VERSION}-amd64"
            done
          done

          for img in "${images[@]}"; do
            for registry in "$REGISTRY" "$REGISTRY_DH"; do
              docker buildx imagetools create \
                -t "${registry}:${img}-${VERSION}" \
                -t "${registry}:${img}" \
                "${registry}:${img}-${VERSION}-amd64" \
                "${registry}:${img}-${VERSION}-arm64"
            done
          done
